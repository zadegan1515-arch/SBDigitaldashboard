<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sponsor a show — SB Agency</title>
<meta name="description" content="Pick the college shows you want your brand at. SB Agency books 400+ shows a year across 100+ campuses.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="/materials/sb-logo.png">
<style>
  :root{--bg:#0d0d0d;--ink:#f5f3ef;--ink-2:#c6c2bb;--ink-3:#8f8d87;--line:#292826;--soft:#191817;--accent:#d9542b;--accent-2:#2a1810;--ok:#4cc98a;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  .top{background:var(--bg);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
  .top img{height:30px;width:auto;display:block;filter:invert(1)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 120px}
  .hero{padding:44px 0 22px}
  .hero h1{font-size:clamp(28px,4.5vw,44px);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}
  .hero p{margin:0;color:var(--ink-2);max-width:640px;font-size:16px}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--ink-3)}
  .stats b{color:var(--ink);font-size:20px;display:block;letter-spacing:-.01em}
  .bar{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .seg button.on{background:var(--ink);color:#111}
  .search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;outline:none;background:var(--soft);color:var(--ink)}
  .search::placeholder{color:var(--ink-3)}
  .search:focus{border-color:var(--ink-3)}
  .sel{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;background:var(--soft);color:var(--ink);max-width:180px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .chip.on{background:var(--accent-2);border-color:var(--accent);color:#f0855e}
  .chip .n{color:var(--ink-3);font-weight:500;margin-left:4px}
  .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 0}
  .count{font-size:13px;color:var(--ink-3);margin:14px 0 8px;display:flex;align-items:center;gap:12px}
  .count a{font-size:12px;color:var(--accent);cursor:pointer}
  .month{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .show{display:grid;grid-template-columns:24px 92px 1fr auto;gap:14px;align-items:center;padding:14px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);margin-bottom:8px;cursor:pointer}
  .show:hover{background:#222120;border-color:#3a3835}
  .show.on{background:var(--accent-2);border-color:var(--accent)}
  .show.past{cursor:default;opacity:.85}
  .show .box{width:20px;height:20px;border:1.5px solid #5c5a56;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:transparent}
  .show.on .box{background:var(--accent);border-color:var(--accent)}
  .show .date b{display:block;font-size:16px;letter-spacing:-.01em}
  .show .date span{font-size:12px;color:var(--ink-3)}
  .show .main .artist{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .show .main .where{font-size:14px;color:var(--ink-2);margin-top:2px}
  .show .main .where b{font-weight:600;color:var(--ink)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
  .tag.played{background:#242320;color:#8a8781}
  .empty{padding:50px 10px;text-align:center;color:var(--ink-3)}
  .tray{position:fixed;left:0;right:0;bottom:0;background:#191816;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;transform:translateY(110%);transition:transform .2s;z-index:20;border-top:1px solid var(--line);box-shadow:0 -6px 30px rgba(0,0,0,.5)}
  .tray.show{transform:none}
  .tray .n{font-size:14px}
  .tray .n b{font-size:18px}
  .tray .go{margin-left:auto;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px}
  .tray .clear{background:transparent;border:1px solid #444;color:#ccc;border-radius:999px;padding:9px 14px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
  .modal.show{display:flex}
  .card{background:#161514;border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:26px}
  .card h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
  .card .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 16px}
  .picked{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;max-height:160px;overflow:auto}
  .picked div{padding:2px 0}
  .f{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  .f .full{grid-column:1/-1}
  .f label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
  .f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;outline:none;background:var(--soft);color:var(--ink)}
  .f input:focus,.f textarea:focus{border-color:var(--ink-3)}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
  .morelink{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
  [hidden]{display:none!important}
  .actions{display:flex;gap:10px;align-items:center;margin-top:18px}
  .btn{background:var(--ink);color:#111;border:0;border-radius:999px;padding:12px 22px;font-weight:700}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn[disabled]{opacity:.6;cursor:default}
  .err{color:#ff7a6b;font-size:13px}
  .done{text-align:center;padding:20px 0}
  .done .big{font-size:44px}
  .done h2{margin:8px 0 6px}
  .foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
  @media (max-width:640px){
    .show{grid-template-columns:22px 70px 1fr;gap:10px}
    .show .tags{grid-column:2/-1;justify-content:flex-start}
    .f{grid-template-columns:1fr}
    .hero{padding-top:28px}
    .sel{max-width:140px}
  }
</style>
</head>
<body>
<header class="top">
  <img src="/materials/sb-logo.png" alt="SB Agency">
</header>

<div class="wrap">
  <section class="hero">
    <h1>Pick the shows you want your brand at.</h1>
    <p></p>
    <div class="stats" id="stats"></div>
  </section>

  <div class="bar">
    <div class="seg"><button class="on" data-mode="upcoming">Upcoming</button><button data-mode="past">Past shows</button></div>
    <div class="seg" id="seg-group"><button class="on" data-group="date">By date</button><button data-group="college">By college</button><button data-group="state">By state</button></div>
    <input class="search" id="q" placeholder="Search artist, school, city…" autocomplete="off">
    <select class="sel" id="f-state"><option value="">All states</option></select>
    <select class="sel" id="f-school"><option value="">All schools</option></select>
    <select class="sel" id="f-month"><option value="">Any month</option></select>
  </div>
  <div class="chips" id="f-perf"></div>

  <div class="count" id="count"></div>
  <div id="list"></div>

  <div class="foot">
    <span>© SB Agency · <a href="https://sboyagency.com">sboyagency.com</a></span>
    <span>Questions: <a href="mailto:zach@sboyagency.com">zach@sboyagency.com</a></span>
    <span id="updated"></span>
  </div>
</div>

<div class="tray" id="tray">
  <div class="n"><b id="tray-n">0</b> shows selected</div>
  <button class="clear" id="tray-clear">Clear</button>
  <button class="go" id="tray-go">Request sponsorship →</button>
</div>

<div class="modal" id="modal">
  <div class="card" id="card"></div>
</div>

<script>
(function () {
  var SHOWS = [], mode = 'upcoming', group = 'date', q = '', fState = '', fSchool = '', fMonth = '', fPerf = '', fGenre = '';
  var picked = {};
  // ?pick=id,id&for=Brand&b=brandId → a hand-picked list for one brand.
  // ?state=TX&genre=edm&performer=dj&school=…&q=…&group=college → open with filters applied.
  var P = new URLSearchParams(location.search);
  var PICK = (P.get('pick') || '').split(',').filter(Boolean);
  var FOR = (P.get('for') || '').slice(0, 80), BRAND_ID = (P.get('b') || '').slice(0, 40);
  fState = P.get('state') || ''; fGenre = P.get('genre') || ''; fSchool = P.get('school') || ''; q = P.get('q') || '';
  fPerf = (P.get('performer') || '').toLowerCase();
  var oldType = (P.get('type') || '').toLowerCase();           // pre-performer links
  if (!fPerf && oldType) fPerf = oldType === 'dj' ? 'dj' : 'band';
  group = { college: 'college', state: 'state' }[P.get('group')] || 'date';
  if (q) document.getElementById('q').value = q;
  document.querySelectorAll('#seg-group button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-group') === group); });
  var PERF_LABEL = { dj: 'DJs', singer: 'Singers', rapper: 'Rappers', band: 'Live bands' };
  // One tag per show: the act, flavored by genre where that adds anything.
  function actTag(s) {
    if (s.performer === 'rapper') return 'Rapper';
    if (s.performer === 'band') return 'Live band';
    if (s.performer === 'singer') return s.genre === 'country' ? 'Country singer' : s.genre === 'pop' ? 'Pop singer' : 'Singer';
    return 'DJ';
  }
  var STATE_NAME = { AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California', CO:'Colorado', CT:'Connecticut', DE:'Delaware', DC:'Washington DC', FL:'Florida', GA:'Georgia', HI:'Hawaii', ID:'Idaho', IL:'Illinois', IN:'Indiana', IA:'Iowa', KS:'Kansas', KY:'Kentucky', LA:'Louisiana', ME:'Maine', MD:'Maryland', MA:'Massachusetts', MI:'Michigan', MN:'Minnesota', MS:'Mississippi', MO:'Missouri', MT:'Montana', NE:'Nebraska', NV:'Nevada', NH:'New Hampshire', NJ:'New Jersey', NM:'New Mexico', NY:'New York', NC:'North Carolina', ND:'North Dakota', OH:'Ohio', OK:'Oklahoma', OR:'Oregon', PA:'Pennsylvania', RI:'Rhode Island', SC:'South Carolina', SD:'South Dakota', TN:'Tennessee', TX:'Texas', UT:'Utah', VT:'Vermont', VA:'Virginia', WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming', ON:'Ontario, Canada' };
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function d(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; }
  function fmt(iso, opts) { var x = d(iso); return x ? x.toLocaleDateString('en-US', Object.assign({ timeZone: 'UTC' }, opts)) : iso; }
  function stateName(st) { return STATE_NAME[st] || st || 'Other'; }

  function load() {
    document.getElementById('list').innerHTML = '<div class="empty">Loading shows…</div>';
    fetch('/api/public/shows').then(function (r) { return r.json(); }).then(function (r) {
      if (!r.ok) throw new Error(r.error || 'Could not load');
      SHOWS = r.shows;
      if (PICK.length) {
        var only = SHOWS.filter(function (s) { return PICK.indexOf(s.id) >= 0; });
        if (only.length) {
          SHOWS = only;
          document.querySelector('.hero h1').textContent = FOR ? 'Shows we picked for ' + FOR + '.' : 'Shows we picked for you.';
          document.querySelector('.hero p').innerHTML = 'Tick the ones you want to be at and send the request — we\'ll come back with a package. <a href="/partnerships" style="color:var(--accent)">See every show →</a>';
          document.getElementById('f-school').style.display = 'none'; document.getElementById('stats').style.display = 'none';
          if (!only.some(function (s) { return !s.past; })) { mode = 'past'; document.querySelectorAll('.seg button[data-mode]').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-mode') === 'past'); }); }
          if (only.some(function (s) { return !s.past; })) only.forEach(function (s) { if (!s.past) picked[s.id] = s; });
        }
      }
      var up = SHOWS.filter(function (s) { return !s.past; });
      var schools = {}, states = {};
      up.forEach(function (s) { schools[s.school] = 1; if (s.state) states[s.state] = 1; });
      document.getElementById('stats').innerHTML =
        '<div><b>' + r.upcoming + '</b>upcoming shows</div>' +
        '<div><b>' + Object.keys(schools).length + '</b>schools</div>' +
        '<div><b>' + Object.keys(states).length + '</b>states</div>' +
        '<div><b>' + r.past + '</b>past shows</div>';
      if (r.updatedAt) document.getElementById('updated').textContent = 'Show list updated ' + new Date(r.updatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      buildFilters(); render();
    }).catch(function (e) { document.getElementById('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }

  function pool() { return SHOWS.filter(function (s) { return mode === 'past' ? s.past : !s.past; }); }

  function buildFilters() {
    var p = pool();
    var states = {}, schools = {}, months = {}, perfs = {};
    p.forEach(function (s) {
      if (s.state) states[s.state] = (states[s.state] || 0) + 1;
      schools[s.school] = (schools[s.school] || 0) + 1;
      var k = s.date.slice(0, 7); months[k] = (months[k] || 0) + 1;
      perfs[s.performer || 'dj'] = (perfs[s.performer || 'dj'] || 0) + 1;
    });
    var opt = function (v, label, n, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + (n != null ? ' (' + n + ')' : '') + '</option>'; };
    var st = Object.keys(states).sort();
    document.getElementById('f-state').innerHTML = opt('', 'All states', null, fState) + st.map(function (x) { return opt(x, x, states[x], fState); }).join('');
    if (fState && !states[fState]) fState = '';
    var sc = Object.keys(schools).sort();
    document.getElementById('f-school').innerHTML = opt('', 'All schools', null, fSchool) + sc.map(function (x) { return opt(x, x, schools[x], fSchool); }).join('');
    if (fSchool && !schools[fSchool]) fSchool = '';
    var mo = Object.keys(months).sort(); if (mode === 'past') mo.reverse();
    document.getElementById('f-month').innerHTML = opt('', 'Any month', null, fMonth) + mo.map(function (x) { return opt(x, MONTHS[+x.slice(5, 7) - 1] + ' ' + x.slice(0, 4), months[x], fMonth); }).join('');
    if (fMonth && !months[fMonth]) fMonth = '';
    var chip = function (k, v, label, n, cur) { return '<button class="chip' + (v === cur ? ' on' : '') + '" data-f="' + k + '" data-v="' + esc(v) + '">' + esc(label) + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>'; };
    var pf = ['dj', 'singer', 'rapper', 'band'].filter(function (k) { return perfs[k]; });
    document.getElementById('f-perf').innerHTML = chip('perf', '', 'Any act', null, fPerf) + pf.map(function (x) { return chip('perf', x, PERF_LABEL[x], perfs[x], fPerf); }).join('');
  }

  function filtered() {
    var qq = q.trim().toLowerCase();
    return pool().filter(function (s) {
      if (fState && s.state !== fState) return false;
      if (fSchool && s.school !== fSchool) return false;
      if (fMonth && s.date.slice(0, 7) !== fMonth) return false;
      if (fPerf && (s.performer || 'dj') !== fPerf) return false;
      if (fGenre && (s.genre || 'other') !== fGenre) return false;
      if (qq && [s.artist, s.school, s.schoolShort, s.city, s.state, s.chapter].join(' ').toLowerCase().indexOf(qq) < 0) return false;
      return true;
    });
  }

  // What heads each section of the list, per grouping mode.
  function sectionKey(s) { return group === 'college' ? s.school : group === 'state' ? (s.state || '') : s.date.slice(0, 7); }
  function sectionLabel(s, count) {
    if (group === 'college') {
      var where = [s.city, s.state].filter(Boolean).join(', ');
      return esc(s.school) + (where ? ' — ' + esc(where) : '') + ' · ' + count + ' show' + (count === 1 ? '' : 's');
    }
    if (group === 'state') return esc(stateName(s.state)) + ' · ' + count + ' show' + (count === 1 ? '' : 's');
    var mk = s.date.slice(0, 7);
    return MONTHS[+mk.slice(5, 7) - 1] + ' ' + mk.slice(0, 4);
  }

  function render() {
    var rows = filtered();
    if (group === 'date') {
      if (mode === 'past') rows = rows.slice().reverse();
    } else {
      // Alphabetical sections (college name, or state name), dates inside.
      rows = rows.slice().sort(function (a, b) {
        var ka = group === 'college' ? a.school : stateName(a.state);
        var kb = group === 'college' ? b.school : stateName(b.state);
        if (ka !== kb) return ka < kb ? -1 : 1;
        if (group === 'state' && a.school !== b.school) return a.school < b.school ? -1 : 1;
        return a.date < b.date ? -1 : 1;
      });
    }
    var counts = {};
    rows.forEach(function (s) { var k = sectionKey(s); counts[k] = (counts[k] || 0) + 1; });
    var list = document.getElementById('list');
    document.getElementById('count').innerHTML = rows.length + (mode === 'past' ? ' past shows' : ' upcoming shows') +
      (fState || fSchool || fMonth || fPerf || fGenre || q ? ' · <a id="clear-f">clear filters</a>' : '');
    if (!rows.length) { list.innerHTML = '<div class="empty">No shows match — try fewer filters.</div>'; return; }
    var h = '', lastKey = null;
    rows.forEach(function (s) {
      var mk = sectionKey(s);
      if (mk !== lastKey) { lastKey = mk; h += '<div class="month">' + sectionLabel(s, counts[mk]) + '</div>'; }
      var on = !!picked[s.id];
      h += '<div class="show' + (on ? ' on' : '') + (s.past ? ' past' : '') + '" data-id="' + esc(s.id) + '">' +
        '<div class="box">' + (on ? '✓' : '') + '</div>' +
        '<div class="date"><b>' + fmt(s.date, { month: 'short', day: 'numeric' }) + '</b><span>' + fmt(s.date, { weekday: 'long' }) + '</span></div>' +
        '<div class="main"><div class="artist">' + esc(s.artist) + '</div>' +
          '<div class="where"><b>' + esc(s.school) + '</b>' + (s.chapter ? ' · ' + esc(s.chapter) : '') + ((s.city || s.state) ? ' · ' + esc([s.city, s.state].filter(Boolean).join(', ')) : '') + '</div></div>' +
        '<div class="tags">' +
          '<span class="tag">' + esc(actTag(s)) + '</span>' +
          (s.past ? '<span class="tag played">Played</span>' : '') + '</div>' +
      '</div>';
    });
    list.innerHTML = h;
    tray();
  }

  function tray() {
    var n = Object.keys(picked).length;
    document.getElementById('tray-n').textContent = n;
    document.getElementById('tray').classList.toggle('show', n > 0);
  }

  // events
  document.querySelectorAll('.seg button[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.seg button[data-mode]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); mode = b.getAttribute('data-mode'); fMonth = ''; buildFilters(); render();
    });
  });
  document.querySelectorAll('#seg-group button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#seg-group button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); group = b.getAttribute('data-group'); render();
    });
  });
  document.getElementById('q').addEventListener('input', function () { q = this.value; render(); });
  document.getElementById('f-state').addEventListener('change', function () { fState = this.value; render(); });
  document.getElementById('f-school').addEventListener('change', function () { fSchool = this.value; render(); });
  document.getElementById('f-month').addEventListener('change', function () { fMonth = this.value; render(); });
  document.addEventListener('click', function (e) {
    var c = e.target.closest('.chip[data-f]');
    if (c) { fPerf = c.getAttribute('data-v'); buildFilters(); render(); return; }
    if (e.target.id === 'clear-f') { q = ''; fState = fSchool = fMonth = fPerf = fGenre = ''; document.getElementById('q').value = ''; buildFilters(); render(); return; }
    var row = e.target.closest('.show[data-id]');
    if (row && !row.classList.contains('past')) {
      var id = row.getAttribute('data-id');
      if (picked[id]) delete picked[id]; else picked[id] = SHOWS.filter(function (s) { return s.id === id; })[0];
      row.classList.toggle('on', !!picked[id]); row.querySelector('.box').textContent = picked[id] ? '✓' : '';
      tray();
    }
  });
  document.getElementById('tray-clear').addEventListener('click', function () { picked = {}; render(); });
  document.getElementById('tray-go').addEventListener('click', openForm);

  function openForm() {
    var ids = Object.keys(picked); if (!ids.length) return;
    var list = ids.map(function (id) { return picked[id]; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    // A returning brand shouldn't retype anything.
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem('sbRequester') || '{}') || {}; } catch (e) { saved = {}; }
    var card = document.getElementById('card');
    card.innerHTML = '<h2>Request sponsorship</h2><p class="sub">Three fields and you\'re done — we come back within a business day with options and pricing.</p>' +
      '<div class="picked">' + list.map(function (s) { return '<div>' + fmt(s.date, { month: 'short', day: 'numeric' }) + ' · <b>' + esc(s.artist) + '</b> · ' + esc(s.school) + (s.state ? ', ' + esc(s.state) : '') + '</div>'; }).join('') + '</div>' +
      '<form id="rq" class="f" autocomplete="on">' +
        '<div class="full"><label>Work email</label><input name="email" type="email" required maxlength="200" autocomplete="email" value="' + esc(saved.email || '') + '"></div>' +
        '<div><label>Your name</label><input name="name" required maxlength="120" autocomplete="name" value="' + esc(saved.name || '') + '"></div>' +
        '<div><label>Company / brand</label><input name="company" required maxlength="120" autocomplete="organization" value="' + esc(FOR || saved.company || '') + '"></div>' +
        '<div class="full"><span class="morelink" id="rq-more">+ Add budget, phone or a note (optional)</span></div>' +
        '<div class="full" id="rq-extra" hidden>' +
          '<div class="f" style="margin-top:2px">' +
          '<div><label>Budget range</label><select name="budget"><option value="">Prefer not to say</option><option>Under $5k</option><option>$5k – $15k</option><option>$15k – $50k</option><option>$50k+</option></select></div>' +
          '<div><label>Phone</label><input name="phone" maxlength="40" autocomplete="tel" value="' + esc(saved.phone || '') + '"></div>' +
          '<div class="full"><label>What are you hoping to do at these shows?</label><textarea name="notes" rows="3" maxlength="2000" placeholder="Sampling, signage, ambassadors, content…"></textarea></div>' +
          '</div>' +
        '</div>' +
        '<div class="hp" aria-hidden="true"><label>Website</label><input name="website_url" tabindex="-1" autocomplete="off"></div>' +
        '<div class="full actions"><button class="btn" type="submit">Send request →</button><button class="btn ghost" type="button" id="rq-cancel">Back</button><span class="err" id="rq-err"></span></div>' +
      '</form>';
    document.getElementById('modal').classList.add('show');
    card.querySelector('#rq-more').onclick = function () { card.querySelector('#rq-extra').hidden = false; this.hidden = true; };
    card.querySelector('#rq-cancel').onclick = function () { document.getElementById('modal').classList.remove('show'); };
    var firstEmpty = ['email', 'name', 'company'].map(function (k) { return card.querySelector('input[name=' + k + ']'); }).filter(function (i) { return !i.value; })[0];
    if (firstEmpty) firstEmpty.focus();
    card.querySelector('#rq').onsubmit = function (ev) {
      ev.preventDefault();
      var f = ev.target, btn = f.querySelector('button[type=submit]'), err = f.querySelector('#rq-err');
      btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
      var body = { showIds: ids, brandId: BRAND_ID || undefined };
      ['company', 'name', 'email', 'phone', 'budget', 'notes', 'website_url'].forEach(function (k) { body[k] = f.elements[k].value; });
      fetch('/api/public/request', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (!r.ok) throw new Error(r.error || 'Something went wrong');
          try { localStorage.setItem('sbRequester', JSON.stringify({ company: body.company, name: body.name, email: body.email, phone: body.phone })); } catch (e) {}
          card.innerHTML = '<div class="done"><div class="big">🎉</div><h2>Got it — thank you.</h2><p class="sub">We\'ve got your picks (' + ids.length + ' show' + (ids.length === 1 ? '' : 's') + ') and will be in touch at <b>' + esc(body.email) + '</b>.</p>' +
            '<button class="btn" id="rq-done">Done</button></div>';
          card.querySelector('#rq-done').onclick = function () { document.getElementById('modal').classList.remove('show'); picked = {}; render(); };
        })
        .catch(function (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Send request →'; });
    };
  }
  document.getElementById('modal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });

  load();
})();
</script>
</body>
</html>
