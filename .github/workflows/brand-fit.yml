# Brand Fit — which brands to reach out to (src/lib/brand-fit.ts), tested
# on every push that could break it: the rules, Stock take's hiding, the
# page against a fake /api/data, and the real /api/data handlers on a
# throwaway Postgres (BigInt money, Hide too small, research import and
# suggest Archive with their Undos). Nothing here reaches Vercel or the
# live database; Postgres is a service container.
name: Brand Fit

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/brand-fit.ts'
      - 'src/lib/brand-size.ts'
      - 'src/lib/stock.ts'
      - 'src/lib/chat-add.ts'
      - 'scripts/test-chat-add*'
      - 'scripts/test-combine*'
      - 'src/lib/parents.ts'
      - 'src/lib/same-person.ts'
      - 'scripts/test-same-person*'
      - 'src/lib/bigint-json.ts'
      - 'src/lib/work-log.ts'
      - 'src/lib/no-send.ts'
      - 'src/lib/email.ts'
      - 'src/lib/google.ts'
      - 'src/lib/giants.ts'
      - 'src/lib/queue-check.ts'
      - 'src/lib/buyers.ts'
      - 'src/lib/claude-hunt.ts'
      - 'src/lib/discover-grade.ts'
      - 'src/lib/find-evidence.ts'
      - 'scripts/test-discover*'
      - 'src/lib/build-ideas.ts'
      - 'src/lib/brand-search.ts'
      - 'src/lib/plan-week.ts'
      - 'src/lib/carry.ts'
      - 'src/lib/queue-rules.ts'
      - 'src/lib/today-order.ts'
      - 'src/lib/brand-work.ts'
      - 'src/lib/outcomes.ts'
      - 'src/lib/skip-day.ts'
      - 'src/lib/week-bank.ts'
      - 'src/lib/reach-again.ts'
      - 'scripts/test-reach-again.mjs'
      - 'scripts/test-week-*'
      - 'scripts/test-reached-tag.js'
      - 'scripts/test-brand-work.mjs'
      - 'scripts/test-outcomes.mjs'
      - 'scripts/test-skip-day.mjs'
      - 'scripts/test-queue-check.mjs'
      - 'scripts/test-queue-rules.mjs'
      - 'scripts/test-carry.mjs'
      - 'scripts/test-queue-e2e.js'
      - 'src/lib/plan-brands.ts'
      - 'scripts/test-plan-brands-e2e.js'
      - 'scripts/test-schedule-reads-e2e.js'
      - 'scripts/test-brand-search.mjs'
      - 'scripts/test-plan-week.mjs'
      - 'scripts/test-schedule.js'
      - 'scripts/test-outreach-lists.js'
      - 'scripts/test-today*'
      - 'scripts/test-brand-zach.js'
      - 'src/lib/do-not-contact.ts'
      - 'scripts/test-do-not-contact*'
      - 'scripts/test-stop-e2e.js'
      - 'src/lib/li-log-db.ts'
      - 'src/app/api/ingest/**'
      - 'scripts/test-claude-day*'
      - 'src/lib/claude-day.ts'
      - 'scripts/test-work-log.mjs'
      - 'src/app/api/data/**'
      - 'public/app.html'
      - 'scripts/test-brand-fit*'
      - 'scripts/test-stock.mjs'
      - 'scripts/test-reach-filter*'
      - 'prisma/schema.prisma'
      - '.github/workflows/brand-fit.yml'
  pull_request:
    paths:
      - 'src/lib/brand-fit.ts'
      - 'src/lib/brand-size.ts'
      - 'src/lib/stock.ts'
      - 'src/lib/chat-add.ts'
      - 'scripts/test-chat-add*'
      - 'scripts/test-combine*'
      - 'src/lib/parents.ts'
      - 'src/lib/same-person.ts'
      - 'scripts/test-same-person*'
      - 'src/lib/bigint-json.ts'
