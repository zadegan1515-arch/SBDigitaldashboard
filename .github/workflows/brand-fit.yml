      - 'src/lib/find-evidence.ts'
      - 'scripts/test-discover*'
      - 'src/lib/build-ideas.ts'
      - 'src/lib/brand-search.ts'
      - 'src/lib/plan-week.ts'
      - 'src/lib/carry.ts'
      - 'src/lib/queue-rules.ts'
      - 'src/lib/today-order.ts'
      - 'src/lib/brand-work.ts'
      - 'src/lib/outcomes.ts'
