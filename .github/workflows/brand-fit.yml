      - 'scripts/test-brand-fit*'
      - 'scripts/test-stock.mjs'
      - 'scripts/test-reach-filter*'
      - 'prisma/schema.prisma'
      - '.github/workflows/brand-fit.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: sbe2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright + Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Types
        run: npx tsc --noEmit
      - name: Rules
        run: node scripts/test-brand-fit.mjs && node scripts/test-brand-size.mjs && node scripts/test-stock.mjs && node scripts/test-work-log.mjs && node scripts/test-no-send.mjs && node scripts/test-queue-check.mjs && node scripts/test-claude-hunt.mjs && node scripts/test-chat-add.mjs && node scripts/test-brand-search.mjs && node scripts/test-plan-week.mjs && node scripts/test-carry.mjs && node scripts/test-queue-rules.mjs && node scripts/test-today-order.mjs && node scripts/test-same-person.mjs && node scripts/test-brand-work.mjs && node scripts/test-outcomes.mjs && node scripts/test-skip-day.mjs && node scripts/test-discover-grade.mjs && node scripts/test-claude-day.mjs && node scripts/test-do-not-contact.mjs && node scripts/test-week-bank.mjs && node scripts/test-reach-again.mjs
      - name: The page against a fake dashboard
        run: node scripts/test-brand-fit-ui.js && node scripts/test-brands-table.js && node scripts/test-today.js && node scripts/test-schedule.js && node scripts/test-outreach-lists.js && node scripts/test-discover.js && node scripts/test-brand-zach.js && node scripts/test-claude-day.js && node scripts/test-do-not-contact.js && node scripts/test-week-plan.js && node scripts/test-reached-tag.js && node scripts/test-reach-filter.js
      - name: The handlers on a real database
        run: node scripts/test-brand-fit-e2e.js && node scripts/test-today-e2e.js && node scripts/test-chat-add-e2e.js && node scripts/test-combine-e2e.js && node scripts/test-queue-e2e.js && node scripts/test-plan-brands-e2e.js && node scripts/test-schedule-reads-e2e.js && node scripts/test-discover-bulk-e2e.js && node scripts/test-stop-e2e.js && node scripts/test-week-plan-e2e.js && node scripts/test-reach-filter-e2e.js
        env:
          E2E_DATABASE_URL: postgresql://postgres:e2e@localhost:5432/sbe2e
